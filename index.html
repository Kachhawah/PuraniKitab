<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>पुरानी डायरी</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Baloo+2:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f5e9d8;
    --gold:#c9a15a;
    --box-bg:rgba(20,10,5,0.55);
    --box-border:rgba(255,220,180,0.25);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    font-family:'Tiro Devanagari Hindi', serif;
    overflow:hidden;
  }

  body{
    position:relative;
    min-height:100vh;
    background-image:
      linear-gradient(to bottom,
        rgba(10,6,3,0.08) 0%,
        rgba(10,6,3,0.0) 35%,
        rgba(10,6,3,0.05) 65%,
        rgba(10,6,3,0.28) 100%),
      url('background-desktop.png');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
  }

  /* ---------- Bottom cluster: shayari (small) + card ---------- */
  .bottom-cluster{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-bottom:7vh;
  }

  .shayari-wrap{
    width:100%;
    padding:0 6vw;
    text-align:center;
    opacity:0;
    transform:translateY(10px);
    animation:fadeSlideUp 0.9s ease forwards;
    animation-delay:0.15s;
  }

  .shayari{
    color:var(--cream);
    font-size:clamp(13px, 1.6vw, 17px);
    line-height:1.7;
    text-shadow:0 2px 8px rgba(0,0,0,0.7);
    max-width:480px;
    margin:0 auto 5px;
    letter-spacing:0.2px;
    transition:opacity 0.5s ease;
    min-height:1.35em;
  }

  .divider{
    color:var(--gold);
    font-size:11px;
    display:inline-block;
    margin:0 6px;
    opacity:0.85;
  }

  /* ---------- Center-bottom rounded card ---------- */
  .card-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    opacity:0;
    transform:translateY(14px);
    animation:fadeSlideUp 1s ease forwards;
    animation-delay:0.5s;
  }

  .player-pill{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--box-bg);
    border:1px solid var(--box-border);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-radius:999px;
    padding:9px 20px 9px 9px;
    width:min(430px, 90vw);
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
    transition:box-shadow 0.3s ease, border-color 0.3s ease;
  }

  .player-pill:hover{
    box-shadow:0 12px 38px rgba(0,0,0,0.5);
    border-color:rgba(255,220,180,0.4);
  }

  .pp-thumb{
    width:50px;
    height:50px;
    border-radius:12px;
    object-fit:cover;
    flex-shrink:0;
    background:rgba(255,255,255,0.08);
  }

  .pp-info{
    flex:1;
    min-width:0;
  }

  .pp-title{
    font-family:'Baloo 2', sans-serif;
    font-size:13.5px;
    font-weight:600;
    color:var(--cream);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:1px;
  }

  .pp-artist{
    font-family:'Baloo 2', sans-serif;
    font-size:11px;
    color:rgba(245,233,216,0.55);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:7px;
  }

  .pp-progress{
    height:3px;
    width:100%;
    background:rgba(255,255,255,0.2);
    border-radius:3px;
    overflow:hidden;
  }

  .pp-progress-fill{
    height:100%;
    width:0%;
    background:var(--gold);
    border-radius:3px;
    transition:width 0.4s linear;
  }

  .pp-controls{
    display:flex;
    align-items:center;
    gap:6px;
    flex-shrink:0;
  }

  .pp-btn{
    background:none;
    border:none;
    color:rgba(245,233,216,0.75);
    cursor:pointer;
    padding:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:color 0.2s ease, transform 0.2s ease;
  }

  .pp-btn:hover{ color:var(--cream); transform:scale(1.08); }
  .pp-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; border-radius:50%; }

  .pp-btn svg{ width:16px; height:16px; }

  .pp-skip{
    width:48px;
    height:32px;
    padding:0 3px;
    border-radius:16px;
    font-family:'Baloo 2', sans-serif;
    font-size:10px;
    font-weight:600;
    line-height:1;
    white-space:nowrap;
    flex-shrink:0;
  }

  .pp-skip .skip-label{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100%;
    gap:1px;
    pointer-events:none;
  }

  .pp-skip:hover{
    transform:scale(1.05);
    color:var(--cream);
  }

  .pp-play{
    width:36px;
    height:36px;
    border-radius:50%;
    background:var(--cream);
    color:#1a1006;
    padding:0;
  }

  .pp-play:hover{ background:#fff; transform:scale(1.06); }
  .pp-play svg{ width:15px; height:15px; margin-left:2px; }
  .pp-play.is-playing svg{ margin-left:0; }

  #ytHidden{
    position:absolute;
    width:1px;
    height:1px;
    opacity:0;
    pointer-events:none;
    overflow:hidden;
  }

  @keyframes fadeSlideDown{
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes fadeSlideUp{
    to{ opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .shayari-wrap, .card-wrap{ animation:none; opacity:1; transform:none; }
    .pp-progress-fill{ transition:none; }
  }

  @media (max-width:600px){
    html,body{
      width:100%;
      height:100%;
      overflow:hidden;
    }

    body{
      min-height:100svh;
      justify-content:flex-end;
      background-image:
        linear-gradient(to bottom,
          rgba(10,6,3,0.08) 0%,
          rgba(10,6,3,0.0) 35%,
          rgba(10,6,3,0.05) 65%,
          rgba(10,6,3,0.28) 100%),
        url('background.png');
      background-size:cover;
      background-position:center 18%;
      padding-bottom:env(safe-area-inset-bottom);
    }

    body::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(to bottom,
          rgba(0,0,0,0.02) 0%,
          rgba(0,0,0,0.04) 38%,
          rgba(7,4,2,0.32) 58%,
          rgba(7,4,2,0.82) 78%,
          rgba(5,3,2,0.96) 100%);
    }

    .bottom-cluster{
      position:relative;
      z-index:2;
      width:100%;
      padding:0 12px calc(12px + env(safe-area-inset-bottom));
      gap:10px;
    }

    .shayari-wrap{
      width:100%;
      padding:0 8px;
    }

    .shayari{
      max-width:100%;
      margin:0 auto;
      padding:8px 12px 9px;
      border-radius:14px;
      background:rgba(8,5,3,0.52);
      border:1px solid rgba(255,215,145,0.18);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      color:#fff8eb;
      font-size:clamp(14px, 4vw, 17px);
      line-height:1.55;
      letter-spacing:0.1px;
      text-shadow:0 2px 10px rgba(0,0,0,0.95);
      min-height:0;
    }

    .divider{
      color:#f4c96b;
      font-size:11px;
      margin:0 5px;
      text-shadow:0 0 8px rgba(244,201,107,0.55);
    }

    .card-wrap{
      width:100%;
      padding:0;
    }

    .player-pill{
      width:100%;
      max-width:520px;
      min-height:68px;
      gap:9px;
      padding:8px 10px 8px 8px;
      border-radius:20px;
      background:rgba(10,7,5,0.76);
      border:1px solid rgba(255,220,180,0.24);
      box-shadow:0 10px 35px rgba(0,0,0,0.5);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
    }

    .pp-thumb{
      width:48px;
      height:48px;
      border-radius:12px;
    }

    .pp-title{
      font-size:12.5px;
      line-height:1.2;
    }

    .pp-artist{
      font-size:10.5px;
      margin-bottom:6px;
    }

    .pp-controls{
      gap:2px;
    }

    .pp-btn{
      padding:5px;
    }

    .pp-btn svg{
      width:15px;
      height:15px;
    }

    .pp-play{
      width:38px;
      height:38px;
    }
  }

  @media (max-width:380px){
    .bottom-cluster{
      padding-left:8px;
      padding-right:8px;
      gap:7px;
    }

    .shayari-wrap{ padding:0 3px; }

    .shayari{
      font-size:13.5px;
      line-height:1.48;
      padding:7px 9px 8px;
    }

    .pp-thumb{
      width:44px;
      height:44px;
    }

    .pp-title{ font-size:11.5px; }
    .pp-artist{ font-size:10px; }
    .pp-play{ width:36px; height:36px; }
  }

  /* ---------- Memory Diary ---------- */
  .diary-toggle{
    position:fixed;
    top:24px;
    right:24px;
    z-index:30;
    border:1px solid rgba(255,220,180,.35);
    background:rgba(20,10,5,.62);
    color:var(--cream);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-radius:999px;
    padding:10px 16px;
    font-family:'Baloo 2',sans-serif;
    font-size:13px;
    cursor:pointer;
    box-shadow:0 8px 28px rgba(0,0,0,.3);
  }
  .diary-toggle:hover{transform:translateY(-1px);border-color:rgba(255,220,180,.6)}

  .diary-overlay{
    position:fixed;
    inset:0;
    z-index:40;
    display:none;
    align-items:center;
    justify-content:flex-end;
    padding:24px;
    background:rgba(8,4,2,.22);
  }
  .diary-overlay.is-open{display:flex}

  .diary{
    width:min(620px,94vw);
    height:min(760px,88vh);
    position:relative;
    perspective:1800px;
    filter:drop-shadow(0 20px 50px rgba(0,0,0,.45));
  }

  .diary-book{
    position:relative;
    width:100%;
    height:100%;
    border-radius:14px 20px 20px 14px;
  }

  .diary-page{
    position:absolute;
    inset:0;
    padding:52px 54px 72px;
    background:
      radial-gradient(circle at 20% 15%,rgba(201,161,90,.12),transparent 28%),
      linear-gradient(90deg,rgba(70,35,12,.08),transparent 5%,transparent 95%,rgba(70,35,12,.12)),
      #f4e7cf;
    color:#3d2818;
    border:1px solid rgba(91,55,24,.28);
    border-radius:14px 20px 20px 14px;
    box-shadow:inset 0 0 45px rgba(89,51,20,.12);
    transform-origin:left center;
    transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .35s ease;
    overflow:hidden;
  }
  .diary-page::before{
    content:"";
    position:absolute;
    inset:18px;
    border:1px solid rgba(115,75,38,.18);
    border-radius:8px 14px 14px 8px;
    pointer-events:none;
  }
  .diary-page{
    transform-style:preserve-3d;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    touch-action:pan-y;
    cursor:grab;
  }
  .diary-page:active{cursor:grabbing}
  .diary-page.flipping-next{
    transform:rotateY(-155deg) translateX(-3%);
    opacity:.15;
  }
  .diary-page.flipping-prev{
    transform:rotateY(155deg) translateX(3%);
    opacity:.15;
  }

  .diary-paper-lines{
    position:absolute;
    inset:82px 54px 72px;
    background:repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 31px,
      rgba(105,78,47,.14) 32px
    );
    pointer-events:none;
  }

  .diary-close{
    position:absolute;
    top:16px;
    right:18px;
    z-index:4;
    width:34px;
    height:34px;
    border:0;
    border-radius:50%;
    background:rgba(61,40,24,.1);
    color:#4b301c;
    cursor:pointer;
    font-size:22px;
  }

  .diary-label{
    font-family:'Baloo 2',sans-serif;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:#96703c;
    margin-bottom:8px;
  }
  .diary-title{
    font-size:30px;
    color:#402818;
    margin-bottom:5px;
  }
  .diary-date{
    font-family:'Baloo 2',sans-serif;
    font-size:12px;
    color:#987550;
    margin-bottom:24px;
  }
  .diary-text{
    width:100%;
    height:calc(100% - 150px);
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:#3b281a;
    font-family:'Tiro Devanagari Hindi',serif;
    font-size:17px;
    line-height:2;
    padding:0 6px;
  }
  .diary-text::placeholder{color:rgba(61,40,24,.45)}

  .diary-footer{
    position:absolute;
    left:54px;
    right:54px;
    bottom:22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    font-family:'Baloo 2',sans-serif;
    color:#8b6738;
    font-size:12px;
  }
  .diary-actions{display:flex;gap:7px;align-items:center}
  .diary-btn{
    border:1px solid rgba(91,55,24,.25);
    background:rgba(255,255,255,.25);
    color:#4b301c;
    border-radius:999px;
    padding:7px 12px;
    font-family:'Baloo 2',sans-serif;
    cursor:pointer;
  }
  .diary-btn:hover{background:rgba(255,255,255,.45)}
  .diary-btn:disabled{
    opacity:.35;
    cursor:not-allowed;
    background:rgba(255,255,255,.12);
  }
  .diary-page-number{white-space:nowrap}

  .diary-hint{
    position:fixed;
    left:24px;
    bottom:22px;
    z-index:20;
    font-family:'Baloo 2',sans-serif;
    color:rgba(245,233,216,.72);
    font-size:11px;
    background:rgba(20,10,5,.35);
    padding:6px 10px;
    border-radius:999px;
    backdrop-filter:blur(8px);
  }

  @media (max-width:900px){
    .diary-overlay{align-items:center;justify-content:center;padding:12px}
    .diary{width:min(94vw,620px);height:min(82vh,760px)}
    .diary-toggle{top:14px;right:14px}
    .diary-hint{display:none}
  }

  @media (max-width:600px){
    .diary-toggle{top:12px;right:12px;padding:8px 12px;font-size:12px}
    .diary-overlay{padding:8px}
    .diary{width:96vw;height:84svh}
    .diary-page{padding:44px 28px 62px}
    .diary-page::before{inset:12px}
    .diary-paper-lines{inset:74px 28px 62px}
    .diary-title{font-size:24px}
    .diary-date{margin-bottom:16px}
    .diary-text{font-size:15px;line-height:1.9;height:calc(100% - 122px)}
    .diary-footer{left:28px;right:28px;bottom:16px}
    .diary-btn{padding:6px 9px}
  }

</style>
</head>
<body>

  <button class="diary-toggle" id="diaryToggle" type="button">📖 मेरी डायरी</button>
  <div class="diary-hint">अपनी यादें लिखने के लिए डायरी खोलें</div>

  <div class="diary-overlay" id="diaryOverlay" aria-hidden="true">
    <div class="diary" id="diary">
      <div class="diary-book">
        <section class="diary-page" id="diaryPage">
          <button class="diary-close" id="diaryClose" type="button" aria-label="डायरी बंद करें">×</button>
          <div class="diary-paper-lines"></div>

          <div class="diary-label">पुरानी डायरी • मेरी यादें</div>
          <h2 class="diary-title">आज की याद</h2>
          <div class="diary-date" id="diaryDate"></div>

          <textarea
            class="diary-text"
            id="diaryText"
            maxlength="3000"
            placeholder="आज क्या हुआ...&#10;&#10;कोई ऐसी बात जो तुम हमेशा याद रखना चाहते हो, यहाँ लिखो।&#10;&#10;यह पन्ना सिर्फ तुम्हारा है ❤️"
            aria-label="अपनी याद लिखें"
          ></textarea>

          <div class="diary-footer">
            <div class="diary-page-number" id="diaryPageNumber">पन्ना 1</div>
            <div class="diary-actions">
              <button class="diary-btn" id="diaryPrev" type="button">‹ पिछला पन्ना</button>
              <button class="diary-btn" id="diaryNext" type="button">अगला पन्ना ›</button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>


  <div class="bottom-cluster">
    <div class="shayari-wrap">
      <p class="shayari" id="shayariText"></p>
    </div>

    <div class="card-wrap">
      <div class="player-pill">
        <img class="pp-thumb" id="ppThumb" src="https://img.youtube.com/vi/rTuxUAuJRyY/hqdefault.jpg" alt="">

        <div class="pp-info">
          <div class="pp-title" id="ppTitle">पुरानी यादें</div>
          <div class="pp-artist" id="ppArtist">प्लेलिस्ट लोड हो रही है…</div>
          <div class="pp-progress"><div class="pp-progress-fill" id="ppFill"></div></div>
        </div>

        <div class="pp-controls">
          <button type="button" class="pp-btn pp-skip" id="ppBack10" aria-label="10 सेकंड पीछे" title="10 सेकंड पीछे">
            <span class="skip-label">↶ 10s</span>
          </button>
          <button type="button" class="pp-btn" id="ppPrev" aria-label="पिछला गाना">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button type="button" class="pp-btn pp-play" id="ppPlay" aria-label="चलाएँ / रोकें">
            <svg id="ppPlayIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button type="button" class="pp-btn" id="ppNext" aria-label="अगला गाना">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6v12l8.5-6z"/></svg>
          </button>
          <button type="button" class="pp-btn pp-skip" id="ppForward20" aria-label="20 सेकंड आगे" title="20 सेकंड आगे">
            <span class="skip-label">20s ↷</span>
          </button>
        </div>
      </div>

      <div id="ytHidden"></div>
    </div>
  </div>

<script>

  /* ---------- Personal Memory Diary ---------- */
  const diaryToggle = document.getElementById('diaryToggle');
  const diaryOverlay = document.getElementById('diaryOverlay');
  const diaryClose = document.getElementById('diaryClose');
  const diaryPage = document.getElementById('diaryPage');
  const diaryText = document.getElementById('diaryText');
  const diaryDate = document.getElementById('diaryDate');
  const diaryPageNumber = document.getElementById('diaryPageNumber');
  const diaryPrev = document.getElementById('diaryPrev');
  const diaryNext = document.getElementById('diaryNext');

  const DIARY_KEY = 'puraniDiaryMemoriesV1';
  let diaryPages = [];
  let diaryIndex = 0;
  let diarySaveTimer = null;

  function diaryToday(){
    return new Intl.DateTimeFormat('hi-IN', {
      day:'numeric', month:'long', year:'numeric'
    }).format(new Date());
  }

  function diaryLoad(){
    try{
      const saved = JSON.parse(localStorage.getItem(DIARY_KEY) || '[]');
      diaryPages = Array.isArray(saved) && saved.length ? saved : [{
        date: diaryToday(),
        text: ''
      }];
    }catch(e){
      diaryPages = [{date: diaryToday(), text:''}];
    }
  }

  function diaryPersist(){
    try{
      localStorage.setItem(DIARY_KEY, JSON.stringify(diaryPages));
    }catch(e){}
  }

  function diaryRender(){
    const page = diaryPages[diaryIndex] || {date:diaryToday(), text:''};
    diaryDate.textContent = page.date;
    diaryText.value = page.text;
    diaryPageNumber.textContent = `पन्ना ${diaryIndex + 1} / ${diaryPages.length}`;
    diaryPrev.disabled = diaryIndex === 0;
    diaryNext.textContent = diaryIndex === diaryPages.length - 1 ? 'नया पन्ना ›' : 'अगला पन्ना ›';
  }

  function diarySaveCurrent(){
    if(!diaryPages[diaryIndex]) return;
    diaryPages[diaryIndex].text = diaryText.value;
    diaryPersist();
  }

  function diaryAddPage(){
    diarySaveCurrent();
    diaryPages.push({
      date: diaryToday(),
      text: ''
    });
    diaryIndex = diaryPages.length - 1;
    diaryRender();
    diaryText.focus();
  }

  function diaryTurn(direction){
    diarySaveCurrent();

    const target = diaryIndex + direction;
    if(target < 0) return;

    if(target >= diaryPages.length){
      diaryAddPage();
      return;
    }

    diaryPage.classList.remove('flipping-next','flipping-prev');
    void diaryPage.offsetWidth;
    diaryPage.classList.add(direction > 0 ? 'flipping-next' : 'flipping-prev');

    setTimeout(() => {
      diaryIndex = target;
      diaryRender();
      diaryPage.classList.remove('flipping-next','flipping-prev');
    }, 360);

  // Real-book style page turning: swipe left/right on the diary.
  let diarySwipeStartX = null;
  let diarySwipeStartY = null;
  let diarySwipeActive = false;

  function diarySwipeStart(e){
    if(e.target.closest('textarea, button')) return;
    const point = e.touches ? e.touches[0] : e;
    diarySwipeStartX = point.clientX;
    diarySwipeStartY = point.clientY;
    diarySwipeActive = true;
  }

  function diarySwipeEnd(e){
    if(!diarySwipeActive || diarySwipeStartX === null) return;
    const point = e.changedTouches ? e.changedTouches[0] : e;
    const dx = point.clientX - diarySwipeStartX;
    const dy = point.clientY - diarySwipeStartY;

    diarySwipeStartX = null;
    diarySwipeStartY = null;
    diarySwipeActive = false;

    // Ignore mostly vertical gestures.
    if(Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.25) return;

    if(dx < 0){
      // Swipe left = next page
      diaryTurn(1);
    }else{
      // Swipe right = previous page
      diaryTurn(-1);
    }
  }

  diaryPage.addEventListener('touchstart', diarySwipeStart, {passive:true});
  diaryPage.addEventListener('touchend', diarySwipeEnd, {passive:true});

  // Desktop trackpads/mice can also drag horizontally like a real page.
  diaryPage.addEventListener('pointerdown', diarySwipeStart);

  function getMoodPool(){

  function detectMood(title = ""){
    const t = title.toLowerCase();

    const sadWords = [
      "sad","alone","breakup","broken","bewafa","bewafai","judai","juda",
      "dard","rona","roye","cry","heartbreak","tanha","tanhai","gham",
      "udaas","udas","yaad","yaadein","yaade","missing","goodbye","alvida",
      "adhura","adhuri","bewafa","farewell"

    const loveWords = [
      "love","lover","romantic","romance","ishq","mohabbat","pyaar","pyar",
      "dil","jaan","jaane na","tum","teri","tera","mere","meri","sanam",
      "aashiqui","ishq","chahat","crush","kaho na","hum tum","love song"
    ];

    if(sadWords.some(word => t.includes(word))) return "sad";
    if(loveWords.some(word => t.includes(word))) return "love";
    return "nostalgia";
  }

  function setShayariMood(title = ""){

    }
  }

  function renderShayari(text){
    const parts = text.split(/,(.+)/);
    if(parts.length > 1){
      el.innerHTML = parts[0].trim() + ",<span class='divider'>❤</span>" + parts[1].trim();
    } else {
      el.textContent = text;
    }
  }

  window.onYouTubeIframeAPIReady = function(){
    ytPlayer = new YT.Player('ytHidden', {
      height: '1',
      width: '1',
      videoId: FIRST_VIDEO_ID,
      playerVars:{
        listType:'playlist',
        list: PLAYLIST_ID,
        autoplay:0,
        controls:0
      },
      events:{
        onReady: onPlayerReady,
        onStateChange: onPlayerStateChange
      }
    });
  };

  function onPlayerReady(){
    updateTrackInfo();
  }

  function updateTrackInfo(){
    const data = ytPlayer.getVideoData();
    if(data && data.title){
      ppTitle.textContent = data.title;
      ppArtist.textContent = data.author || 'YouTube';
      ppThumb.src = `https://img.youtube.com/vi/${data.video_id}/hqdefault.jpg`;
      setShayariMood(data.title);
    }
  }

  function onPlayerStateChange(e){
    if(e.data === YT.PlayerState.PLAYING){
      ppPlayIcon.innerHTML = ICON_PAUSE;
      ppPlay.classList.add('is-playing');
      updateTrackInfo();
      startProgressTimer();
    } else {
      ppPlayIcon.innerHTML = ICON_PLAY;
      ppPlay.classList.remove('is-playing');
      if(e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED){
        stopProgressTimer();
      }
    }
  }

  function startProgressTimer(){
    stopProgressTimer();
    progressTimer = setInterval(() => {
      if(!ytPlayer || typeof ytPlayer.getDuration !== 'function') return;
      const dur = ytPlayer.getDuration();
      const cur = ytPlayer.getCurrentTime();
      if(dur > 0){
        ppFill.style.width = ((cur / dur) * 100) + '%';
      }
    }, 500);
  }

  function stopProgressTimer(){
    if(progressTimer){ clearInterval(progressTimer); progressTimer = null; }
  }

  ppPlay.addEventListener('click', () => {
    if(!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') return;
    const state = ytPlayer.getPlayerState();
    if(state === YT.PlayerState.PLAYING){
      ytPlayer.pauseVideo();
    } else {
      ytPlayer.playVideo();
    }
  });

  ppNext.addEventListener('click', () => { if(ytPlayer) ytPlayer.nextVideo(); });
  ppPrev.addEventListener('click', () => { if(ytPlayer) ytPlayer.previousVideo(); });

  ppBack10.addEventListener('click', () => {
    if(!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
    const current = ytPlayer.getCurrentTime();
    ytPlayer.seekTo(Math.max(0, current - 10), true);
  });

  ppForward20.addEventListener('click', () => {
    if(!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
    const current = ytPlayer.getCurrentTime();
    const duration = typeof ytPlayer.getDuration === 'function' ? ytPlayer.getDuration() : 0;
    const target = duration > 0 ? Math.min(duration, current + 20) : current + 20;
    ytPlayer.seekTo(target, true);
  });
