      const audio = document.getElementById('chaiSipAudio');

      let isDragging = false;
      let startX, startY, initialX, initialY;
      let hasMoved = false;

      const savedPos = localStorage.getItem('puraniDiary_chaiPos');
      if (savedPos) {
        try {
          const pos = JSON.parse(savedPos);
          if (pos.left && pos.top) {
            chai.style.left = pos.left;
            chai.style.top = pos.top;
            chai.style.transform = 'none';
          }
        } catch (e) {}
      }

      function sipChai() {
        chai.classList.remove('chai-cup-sip');
        void chai.offsetWidth;

        if (audio) {
          audio.currentTime = 0;
          audio.play().catch(() => {});
        }
      }

      function onDown(e) {
        isDragging = true;
        hasMoved = false;
        chai.classList.add('is-dragging');
        const pointer = e.touches ? e.touches[0] : e;
        startX = pointer.clientX;
        startY = pointer.clientY;
        const rect = chai.getBoundingClientRect();
        initialX = rect.left;
        initialY = rect.top;

      function onMove(e) {
        if (!isDragging) return;
        const pointer = e.touches ? e.touches[0] : e;
        const dx = pointer.clientX - startX;
        const dy = pointer.clientY - startY;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
          hasMoved = true;
        }
        let newX = initialX + dx;
        let newY = initialY + dy;
        newX = Math.max(10, Math.min(window.innerWidth - 140, newX));
        newY = Math.max(10, Math.min(window.innerHeight - 160, newY));
        chai.style.left = newX + 'px';
        chai.style.top = newY + 'px';
        chai.style.transform = 'none';
      }

      fontion onUp() {
        if (!isDragging) return;
        isDragging = false;
        chai.classList.remove('is-dragging');
        if (hasMoved) {
          localStorage.setItem('puraniDiary_chaiPos', JSON.stringify({
            left: chai.style.left,
            top: chai.style.top
          }));
        } else {
          sipChai();
        }
      }

      chai.addEventListener('mousedown', onDown);
      window.addEventListener('mousemove', onMove);
      widow.addEventListener('mouseup', onUp);

      window.addEventListener('touchend', onUp);
