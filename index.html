<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>पुरानी डायरी</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Baloo+2:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f5e9d8;
    --gold:#c9a15a;
    --box-bg:rgba(20,10,5,0.55);
    --box-border:rgba(255,220,180,0.25);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    font-family:'Tiro Devanagari Hindi', serif;
    overflow:hidden;
  }

  body{
    position:relative;
    min-height:100vh;
    background-image:
      linear-gradient(to bottom,
        rgba(10,6,3,0.08) 0%,
        rgba(10,6,3,0.0) 35%,
        rgba(10,6,3,0.05) 65%,
        rgba(10,6,3,0.28) 100%),
      url('background.png');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
  }

  /* ---------- Bottom cluster: shayari (small) + card ---------- */
  .bottom-cluster{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-bottom:7vh;
  }

  .shayari-wrap{
    width:100%;
    padding:0 6vw;
    text-align:center;
    opacity:0;
    transform:translateY(10px);
    animation:fadeSlideUp 0.9s ease forwards;
    animation-delay:0.15s;
  }

  .shayari{
    color:var(--cream);
    font-size:clamp(13px, 1.6vw, 17px);
    line-height:1.7;
    text-shadow:0 2px 8px rgba(0,0,0,0.7);
    max-width:480px;
    margin:0 auto 5px;
    letter-spacing:0.2px;
    transition:opacity 0.5s ease;
    min-height:1.35em;
  }

  .divider{
    color:var(--gold);
    font-size:11px;
    display:inline-block;
    margin:0 6px;
    opacity:0.85;
  }

  /* ---------- Center-bottom rounded card ---------- */
  .card-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    opacity:0;
    transform:translateY(14px);
    animation:fadeSlideUp 1s ease forwards;
    animation-delay:0.5s;
  }

  .player-pill{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--box-bg);
    border:1px solid var(--box-border);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-radius:999px;
    padding:9px 20px 9px 9px;
    width:min(430px, 90vw);
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
    transition:box-shadow 0.3s ease, border-color 0.3s ease;
  }

  .player-pill:hover{
    box-shadow:0 12px 38px rgba(0,0,0,0.5);
    border-color:rgba(255,220,180,0.4);
  }

  .pp-thumb{
    width:50px;
    height:50px;
    border-radius:12px;
    object-fit:cover;
    flex-shrink:0;
    background:rgba(255,255,255,0.08);
  }

  .pp-info{
    flex:1;
    min-width:0;
  }

  .pp-title{
    font-family:'Baloo 2', sans-serif;
    font-size:13.5px;
    font-weight:600;
    color:var(--cream);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:1px;
  }

  .pp-artist{
    font-family:'Baloo 2', sans-serif;
    font-size:11px;
    color:rgba(245,233,216,0.55);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:7px;
  }

  .pp-progress{
    height:3px;
    width:100%;
    background:rgba(255,255,255,0.2);
    border-radius:3px;
    overflow:hidden;
  }

  .pp-progress-fill{
    height:100%;
    width:0%;
    background:var(--gold);
    border-radius:3px;
    transition:width 0.4s linear;
  }

  .pp-controls{
    display:flex;
    align-items:center;
    gap:6px;
    flex-shrink:0;
  }

  .pp-btn{
    background:none;
    border:none;
    color:rgba(245,233,216,0.75);
    cursor:pointer;
    padding:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:color 0.2s ease, transform 0.2s ease;
  }

  .pp-btn:hover{ color:var(--cream); transform:scale(1.08); }
  .pp-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; border-radius:50%; }

  .pp-btn svg{ width:16px; height:16px; }

  .pp-play{
    width:36px;
    height:36px;
    border-radius:50%;
    background:var(--cream);
    color:#1a1006;
    padding:0;
  }

  .pp-play:hover{ background:#fff; transform:scale(1.06); }
  .pp-play svg{ width:15px; height:15px; margin-left:2px; }
  .pp-play.is-playing svg{ margin-left:0; }

  #ytHidden{
    position:absolute;
    width:1px;
    height:1px;
    opacity:0;
    pointer-events:none;
    overflow:hidden;
  }

  @keyframes fadeSlideDown{
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes fadeSlideUp{
    to{ opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .shayari-wrap, .card-wrap{ animation:none; opacity:1; transform:none; }
    .pp-progress-fill{ transition:none; }
  }

  @media (max-width:600px){
    body{ overflow:auto; min-height:100svh; }
    .shayari-wrap{ padding-top:7vh; }
    .card-wrap{ padding-bottom:7vh; }
    .player-pill{ padding:8px 16px 8px 8px; }
    .pp-thumb{ width:44px; height:44px; }
  }
</style>
</head>
<body>

  <div class="bottom-cluster">
    <div class="shayari-wrap">
      <p class="shayari" id="shayariText"></p>
    </div>

    <div class="card-wrap">
      <div class="player-pill">
        <img class="pp-thumb" id="ppThumb" src="https://img.youtube.com/vi/rTuxUAuJRyY/hqdefault.jpg" alt="">

        <div class="pp-info">
          <div class="pp-title" id="ppTitle">पुरानी यादें</div>
          <div class="pp-artist" id="ppArtist">प्लेलिस्ट लोड हो रही है…</div>
          <div class="pp-progress"><div class="pp-progress-fill" id="ppFill"></div></div>
        </div>

        <div class="pp-controls">
          <button type="button" class="pp-btn" id="ppPrev" aria-label="पिछला गाना">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button type="button" class="pp-btn pp-play" id="ppPlay" aria-label="चलाएँ / रोकें">
            <svg id="ppPlayIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button type="button" class="pp-btn" id="ppNext" aria-label="अगला गाना">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6v12l8.5-6z"/></svg>
          </button>
        </div>
      </div>

      <div id="ytHidden"></div>
    </div>
  </div>

<script>
  const loveShayari = [

    "कुछ रिश्ते नाम के नहीं, एहसास के होते हैं।",

    "मोहब्बत वो नहीं जो दुनिया को दिखाई जाए, वो है जो दिल में निभाई जाए।",
    "तू साथ बैठ जाए, तो पुरानी बेंच भी यादगार बन जाती है।",

    "तेरी याद आए तो दिल खुद-ब-खुद मुस्कुरा देता है।",
    "मोहब्बत में हिसाब नहीं होता, बस एहसास होता है।",
    "तेरे साथ की एक शाम, अकेले की सौ शामों से बेहतर है।",
    "तू मेरी कहानी नहीं, मेरी सबसे प्यारी याद है।",
    "कुछ लोग दिल में ऐसे उतरते हैं, जैसे शाम धीरे-धीरे उतरती है।",
    "तेरे हाथ की चाय और तेरी बातें, दोनों की आदत अच्छी है।",
    "जिसे देखकर दिल ठहर जाए, वही शायद मोहब्बत है।",
    "तेरे होने से जिंदगी में शोर कम और सुकून ज्यादा है।",
    "तू सामने हो तो वक्त को भी जल्दी जाने की जल्दी नहीं होती।",
    "मेरी पसंद की सबसे खूबसूरत वजह, बस तू है।",
    "दिल की सबसे शांत जगह पर आज भी तेरा नाम है।"
  ];

  const sadShayari = [
    "अब चाय अकेले पी जाती है, बातें अधूरी रह जाती हैं।",
    "बेंच वही है, बस साथ बैठने वाला कोई नहीं।",
    "कुछ लोग चले जाते हैं, बस उनकी यादें रह जाती हैं।",
    "जिसे अपना समझा, वही सबसे दूर निकल गया।",
    "तेरी कमी आज भी उसी जगह महसूस होती है, जहाँ कभी तू बैठा करता था।",
    "कुछ शामें लौटकर नहीं आतीं, बस याद बनकर रह जाती हैं।",
    "हमने इंतज़ार किया, और वक्त ने हमें अकेला कर दिया।",
    "तेरी यादें भी अजीब हैं, आती हैं तो जाने का नाम नहीं लेतीं।",
    "दिल आज भी वहीं है, जहाँ तू छोड़कर गया था।",
    "कभी-कभी किसी की कमी पूरी जिंदगी साथ चलती है।",
    "बातें खत्म हुईं, मगर यादें आज भी बाकी हैं।",
    "तेरे बिना वही शहर है, मगर सब कुछ थोड़ा खाली लगता है।",
    "जिस रास्ते पर साथ चले थे, आज वही रास्ता अकेला लगता है।",
    "कुछ रिश्ते टूटते नहीं, बस बात करना बंद कर देते हैं।",
    "वो पास नहीं है, फिर भी हर जगह नजर आता है।",
    "दिल को समझाया बहुत, मगर यादों ने मानना नहीं सीखा।",
    "जिसे भूलना था, वही सबसे ज्यादा याद आता है।",
    "एक वक्त था जब इंतज़ार अच्छा लगता था, अब थका देता है।",
    "तेरे बाद चाय तो वही है, मगर स्वाद बदल गया है।",
    "हम मुस्कुरा तो देते हैं, मगर हर मुस्कान पूरी नहीं होती।",
    "कुछ दर्द आवाज़ नहीं करते, बस अंदर रहते हैं।",
    "तेरे जाने के बाद खामोशी से दोस्ती हो गई।",
    "जिस शाम तू गया था, शायद वही शाम आज तक खत्म नहीं हुई।",
    "अब किसी से शिकायत नहीं, बस उम्मीद कम हो गई है।",
    "तू नहीं है, इसलिए नहीं कि रास्ते अलग थे, बस मंज़िल अलग निकली।",
    "यादें जितनी पुरानी होती हैं, उतनी ही चुपचाप दर्द करती हैं।",
    "कभी-कभी दिल को भी पता होता है कि कोई वापस नहीं आएगा।",
    "हमने जिसे अपना घर समझा, वही रास्ता बनकर रह गया।",
    "कुछ अलविदा शब्दों से नहीं, खामोशी से कहे जाते हैं।",
    "तू खुश रहे, बस यही चाहा था, खुद को भूलकर भी।",
    "जो कहानी अधूरी रह जाए, वही सबसे ज्यादा याद आती है।"
  ];

  const nostalgiaShayari = [
    "कुछ पन्ने पुराने होते हैं, यादें नहीं।",
    "चाय की भाप में, आज भी वो शाम ज़िंदा है।",
    "गलियाँ बदल गईं, पर बेंच वही पुरानी है।",
    "हर दुकान की एक कहानी होती है, हर कहानी की एक चाय।",
    "वक़्त गुज़रा, बस यादों का रंग नहीं गया।",
    "पुरानी गलियों में आज भी कुछ आवाज़ें सुनाई देती हैं।",
    "कभी-कभी पुरानी जगहें, पुराने लोगों से ज्यादा याद आती हैं।",
    "वो छोटी सी दुकान और वो लंबी-लंबी बातें, सब याद है।",
    "पुरानी यादों की भी अपनी एक खुशबू होती है।",
    "कुछ शामें तस्वीरों में नहीं, दिल में रहती हैं।",
    "बचपन की गलियाँ आज भी मन में वैसी ही हैं।",
    "पुरानी बेंच पर बैठकर, वक्त थोड़ा धीमा लगता है।"
  ];

  let currentMood = "nostalgia";
  let shayariPool = [];
  let poolIndex = 0;
  const el = document.getElementById('shayariText');

  function getMoodPool(){
    if(currentMood === "love") return loveShayari;
    if(currentMood === "sad") return sadShayari;
    return nostalgiaShayari;
  }

  function resetShayariPool(){
    shayariPool = [...getMoodPool()].sort(() => Math.random() - 0.5);
    poolIndex = 0;
  }

  function detectMood(title = ""){
    const t = title.toLowerCase();

    const sadWords = [
      "sad","alone","breakup","broken","bewafa","bewafai","judai","juda",
      "dard","rona","roye","cry","heartbreak","tanha","tanhai","gham",
      "udaas","udas","yaad","yaadein","yaade","missing","goodbye","alvida",
      "adhura","adhuri","bewafa","farewell"
    ];

    const loveWords = [
      "love","lover","romantic","romance","ishq","mohabbat","pyaar","pyar",
      "dil","jaan","jaane na","tum","teri","tera","mere","meri","sanam",
      "aashiqui","ishq","chahat","crush","kaho na","hum tum","love song"
    ];

    if(sadWords.some(word => t.includes(word))) return "sad";
    if(loveWords.some(word => t.includes(word))) return "love";
    return "nostalgia";
  }

  function setShayariMood(title = ""){
    const newMood = detectMood(title);
    if(newMood !== currentMood){
      currentMood = newMood;
      resetShayariPool();
      showNextShayari();
    }
  }

  function renderShayari(text){
    const parts = text.split(/,(.+)/);
    if(parts.length > 1){
      el.innerHTML = parts[0].trim() + ",<span class='divider'>❤</span>" + parts[1].trim();
    } else {
      el.textContent = text;
    }
  }

  function showNextShayari(){
    if(!shayariPool.length || poolIndex >= shayariPool.length){
      resetShayariPool();
    }
    el.style.opacity = 0;
    setTimeout(() => {
      renderShayari(shayariPool[poolIndex]);
      poolIndex++;
      el.style.opacity = 1;
    }, 300);
  }

  resetShayariPool();
  showNextShayari();
  setInterval(showNextShayari, 7000);

  const PLAYLIST_ID = "PLu1VwkFUm56jdkb3_AK9KHBOudjDQ3-J9";
  const FIRST_VIDEO_ID = "rTuxUAuJRyY";

  const ppThumb = document.getElementById('ppThumb');
  const ppTitle = document.getElementById('ppTitle');
  const ppArtist = document.getElementById('ppArtist');
  const ppFill = document.getElementById('ppFill');
  const ppPlay = document.getElementById('ppPlay');
  const ppPlayIcon = document.getElementById('ppPlayIcon');
  const ppPrev = document.getElementById('ppPrev');
  const ppNext = document.getElementById('ppNext');

  const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

  let ytPlayer = null;
  let progressTimer = null;

  // Load YouTube IFrame API
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  window.onYouTubeIframeAPIReady = function(){
    ytPlayer = new YT.Player('ytHidden', {
      height: '1',
      width: '1',
      videoId: FIRST_VIDEO_ID,
      playerVars:{
        listType:'playlist',
        list: PLAYLIST_ID,
        autoplay:0,
        controls:0
      },
      events:{
        onReady: onPlayerReady,
        onStateChange: onPlayerStateChange
      }
    });
  };

  function onPlayerReady(){
    updateTrackInfo();
  }

  function updateTrackInfo(){
    const data = ytPlayer.getVideoData();
    if(data && data.title){
      ppTitle.textContent = data.title;
      ppArtist.textContent = data.author || 'YouTube';
      ppThumb.src = `https://img.youtube.com/vi/${data.video_id}/hqdefault.jpg`;
      setShayariMood(data.title);
    }
  }

  function onPlayerStateChange(e){
    if(e.data === YT.PlayerState.PLAYING){
      ppPlayIcon.innerHTML = ICON_PAUSE;
      ppPlay.classList.add('is-playing');
      updateTrackInfo();
      startProgressTimer();
    } else {
      ppPlayIcon.innerHTML = ICON_PLAY;
      ppPlay.classList.remove('is-playing');
      if(e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED){
        stopProgressTimer();
      }
    }
  }

  function startProgressTimer(){
    stopProgressTimer();
    progressTimer = setInterval(() => {
      if(!ytPlayer || typeof ytPlayer.getDuration !== 'function') return;
      const dur = ytPlayer.getDuration();
      const cur = ytPlayer.getCurrentTime();
      if(dur > 0){
        ppFill.style.width = ((cur / dur) * 100) + '%';
      }
    }, 500);
  }

  function stopProgressTimer(){
    if(progressTimer){ clearInterval(progressTimer); progressTimer = null; }
  }

  ppPlay.addEventListener('click', () => {
    if(!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') return;
    const state = ytPlayer.getPlayerState();
    if(state === YT.PlayerState.PLAYING){
      ytPlayer.pauseVideo();
    } else {
      ytPlayer.playVideo();
    }
  });

  ppNext.addEventListener('click', () => { if(ytPlayer) ytPlayer.nextVideo(); });
  ppPrev.addEventListener('click', () => { if(ytPlayer) ytPlayer.previousVideo(); });
</script>

</body>
</html>
